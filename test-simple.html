<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>功能测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .test-section {
            margin-bottom: 25px;
        }

        .test-section h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        input, textarea, button {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 15px;
            font-family: inherit;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        .result {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            display: none;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            display: none;
        }

        .checkin-count {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            text-align: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🎯 功能测试</h1>
            
            <div class="test-section">
                <h3>测试1：按钮是否有反应？</h3>
                <button onclick="test1()">点我测试</button>
                <div id="result1" class="result"></div>
            </div>

            <div class="test-section">
                <h3>测试2：数据能否保存？</h3>
                <input type="text" id="testInput" placeholder="输入任意内容">
                <button onclick="test2()">保存数据</button>
                <button onclick="test2Load()">读取数据</button>
                <div id="result2" class="result"></div>
            </div>

            <div class="test-section">
                <h3>测试3：打卡功能</h3>
                <div class="checkin-count" id="checkinCount">0</div>
                <button onclick="checkin()">点击打卡</button>
                <div id="result3" class="success"></div>
            </div>

            <div class="test-section">
                <h3>测试4：数据备份</h3>
                <button onclick="backup()">📥 备份数据</button>
                <div id="result4" class="result"></div>
            </div>
        </div>
    </div>

    <script>
        function test1() {
            const result = document.getElementById('result1');
            result.style.display = 'block';
            result.innerHTML = '✅ 太好了！按钮可以点击，JavaScript正常工作！';
        }

        function test2() {
            const input = document.getElementById('testInput');
            const value = input.value;
            if (!value) {
                alert('请先输入内容');
                return;
            }
            
            try {
                localStorage.setItem('test_data', value);
                const result = document.getElementById('result2');
                result.style.display = 'block';
                result.innerHTML = '✅ 数据已保存：' + value;
            } catch (e) {
                alert('保存失败：' + e.message);
            }
        }

        function test2Load() {
            try {
                const data = localStorage.getItem('test_data');
                const result = document.getElementById('result2');
                result.style.display = 'block';
                if (data) {
                    result.innerHTML = '✅ 读取成功：' + data;
                } else {
                    result.innerHTML = '⚠️ 没有保存过数据';
                }
            } catch (e) {
                alert('读取失败：' + e.message);
            }
        }

        function checkin() {
            try {
                let count = parseInt(localStorage.getItem('checkin_count') || '0');
                count++;
                localStorage.setItem('checkin_count', count);
                
                document.getElementById('checkinCount').textContent = count;
                const result = document.getElementById('result3');
                result.style.display = 'block';
                result.innerHTML = '🎉 打卡成功！连续打卡 ' + count + ' 天！';
                
                setTimeout(() => {
                    result.style.display = 'none';
                }, 3000);
            } catch (e) {
                alert('打卡失败：' + e.message);
            }
        }

        function backup() {
            try {
                const data = {
                    test_data: localStorage.getItem('test_data'),
                    checkin_count: localStorage.getItem('checkin_count'),
                    backup_time: new Date().toLocaleString('zh-CN')
                };
                
                const jsonStr = JSON.stringify(data, null, 2);
                
                if (navigator.clipboard) {
                    navigator.clipboard.writeText(jsonStr).then(() => {
                        const result = document.getElementById('result4');
                        result.style.display = 'block';
                        result.innerHTML = '✅ 备份数据已复制到剪贴板！<br><pre>' + jsonStr + '</pre>';
                    });
                } else {
                    const result = document.getElementById('result4');
                    result.style.display = 'block';
                    result.innerHTML = '✅ 备份数据：<br><pre>' + jsonStr + '</pre><br>请手动复制保存';
                }
            } catch (e) {
                alert('备份失败：' + e.message);
            }
        }

        window.onload = function() {
            try {
                const count = localStorage.getItem('checkin_count') || '0';
                document.getElementById('checkinCount').textContent = count;
            } catch (e) {
                console.error('加载数据失败', e);
            }
        };
    </script>
</body>
</html>
