<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>扫码访问 - 个人工作台移动版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 24px;
            padding: 48px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h1 {
            font-size: 28px;
            color: #1F2937;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #6B7280;
            font-size: 16px;
            margin-bottom: 32px;
        }

        .qrcode-container {
            background: #F9FAFB;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 24px;
            display: inline-block;
        }

        #qrcode {
            display: flex;
            justify-content: center;
        }

        .url-display {
            background: #F3F4F6;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 24px;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            color: #4B5563;
        }

        .steps {
            text-align: left;
            background: #F9FAFB;
            border-radius: 12px;
            padding: 20px;
            margin-top: 24px;
        }

        .steps h3 {
            font-size: 16px;
            color: #374151;
            margin-bottom: 12px;
        }

        .steps ol {
            padding-left: 20px;
            color: #6B7280;
            line-height: 1.8;
        }

        .steps li {
            margin-bottom: 8px;
        }

        .warning {
            background: #FEF3C7;
            border-left: 4px solid #F59E0B;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: left;
            font-size: 14px;
            color: #92400E;
        }

        .success {
            background: #D1FAE5;
            border-left: 4px solid #10B981;
            padding: 12px 16px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: left;
            font-size: 14px;
            color: #065F46;
        }

        .button {
            display: inline-block;
            background: #8B5CF6;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 16px;
            transition: all 0.2s;
        }

        .button:hover {
            background: #7C3AED;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 个人工作台移动版</h1>
        <p class="subtitle">使用手机扫描二维码访问</p>

        <div class="qrcode-container">
            <div id="qrcode"></div>
        </div>

        <div class="url-display" id="urlDisplay">
            生成中...
        </div>

        <div class="success">
            <strong>✅ 服务器已启动</strong><br>
            手机和电脑需连接同一个 WiFi
        </div>

        <div class="steps">
            <h3>📋 使用步骤</h3>
            <ol>
                <li>确保手机和电脑在同一个 WiFi 网络</li>
                <li>打开手机微信/浏览器的扫一扫功能</li>
                <li>扫描上方二维码</li>
                <li>在手机浏览器中打开即可使用</li>
            </ol>
        </div>

        <div class="warning">
            <strong>⚠️ 注意事项</strong><br>
            • 不要关闭服务器窗口<br>
            • 手机必须与电脑在同一局域网<br>
            • 访问地址中的端口号是 8000
        </div>

        <a href="index-mobile.html" class="button" target="_blank">在电脑上预览</a>
    </div>

    <!-- 引入 qrcode.js 库 -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script>
        // 获取本机局域网 IP
        function getMobileUrl() {
            // 自动检测当前访问的 IP 和端口
            const hostname = window.location.hostname;
            const port = window.location.port || '8000';
            
            // 如果是 localhost，尝试替换为实际 IP
            let ip = hostname;
            if (hostname === 'localhost' || hostname === '127.0.0.1') {
                ip = '10.93.17.113'; // 你的局域网 IP
            }
            
            return `http://${ip}:${port}/index-mobile.html`;
        }

        // 生成二维码
        const url = getMobileUrl();
        document.getElementById('urlDisplay').textContent = url;

        const qrcode = new QRCode(document.getElementById('qrcode'), {
            text: url,
            width: 256,
            height: 256,
            colorDark: '#1F2937',
            colorLight: '#ffffff',
            correctLevel: QRCode.CorrectLevel.H
        });

        console.log('📱 移动端访问地址:', url);
    </script>
</body>
</html>
