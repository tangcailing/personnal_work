<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人工作台 v3.0 - 现代版</title>
    
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Feather Icons -->
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* 模块配色 */
            --color-work: #dc2626;
            --color-fitness: #ea580c;
            --color-media: #9333ea;
            --color-thought: #0891b2;
            --color-pomodoro: #16a34a;
            --color-stats: #2563eb;
            --color-expression: #db2777;
            
            /* 基础色 */
            --bg-primary: #fafafa;
            --bg-secondary: #ffffff;
            --bg-hover: #f5f5f5;
            --text-primary: #171717;
            --text-secondary: #737373;
            --text-tertiary: #a3a3a3;
            --border: #e5e5e5;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 主布局 */
        .app-container {
            display: flex;
            height: 100vh;
        }

        /* 左侧导航栏 */
        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar-header .version {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-tertiary);
            background: var(--bg-hover);
            padding: 2px 8px;
            border-radius: 4px;
        }

        /* 导航菜单 */
        .nav-menu {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            margin-bottom: 4px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .nav-item:hover {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .nav-item.active {
            background: var(--bg-hover);
            color: var(--text-primary);
            font-weight: 600;
        }

        .nav-item i {
            width: 20px;
            height: 20px;
        }

        .nav-item .badge {
            margin-left: auto;
            background: var(--color-work);
            color: white;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        /* 侧边栏底部 */
        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid var(--border);
        }

        .ai-trigger {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        .ai-trigger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
        }

        /* 主内容区 */
        .main-content {
            margin-left: 280px;
            flex: 1;
            overflow-y: auto;
            padding: 32px;
        }

        /* 顶部时间区 */
        .time-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 48px 40px;
            border-radius: 16px;
            color: white;
            margin-bottom: 32px;
            box-shadow: var(--shadow-lg);
        }

        .time-header .time {
            font-size: 56px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -2px;
        }

        .time-header .date {
            font-size: 18px;
            opacity: 0.9;
            font-weight: 500;
        }

        /* 内容区域 */
        .content-section {
            display: none;
        }

        .content-section.active {
            display: block;
        }

        /* 卡片系统 */
        .card {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            transition: all 0.2s;
        }

        .card:hover {
            box-shadow: var(--shadow-md);
            border-color: var(--text-tertiary);
        }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card-title i {
            width: 20px;
            height: 20px;
        }

        /* 工作计划样式 */
        .task-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 16px;
            background: var(--bg-primary);
            border-radius: 8px;
            margin-bottom: 12px;
            border-left: 3px solid var(--color-work);
            transition: all 0.2s;
        }

        .task-item:hover {
            background: var(--bg-hover);
            transform: translateX(4px);
        }

        .task-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid var(--color-work);
            border-radius: 6px;
            cursor: pointer;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .task-content {
            flex: 1;
        }

        .task-title {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .task-meta {
            font-size: 13px;
            color: var(--text-tertiary);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .priority-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
        }

        .priority-high {
            background: #fee2e2;
            color: #dc2626;
        }

        .priority-medium {
            background: #fef3c7;
            color: #d97706;
        }

        .priority-low {
            background: #dbeafe;
            color: #2563eb;
        }

        /* 输入框样式 */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .input-group input,
        .input-group textarea,
        .input-group select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.2s;
            background: var(--bg-secondary);
        }

        .input-group input:focus,
        .input-group textarea:focus,
        .input-group select:focus {
            outline: none;
            border-color: var(--color-work);
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }

        .input-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        /* 按钮样式 */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--color-work);
            color: white;
        }

        .btn-primary:hover {
            background: #b91c1c;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(220, 38, 38, 0.3);
        }

        .btn-secondary {
            background: var(--bg-hover);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 64px 24px;
            color: var(--text-tertiary);
        }

        .empty-state i {
            width: 48px;
            height: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state p {
            font-size: 15px;
            margin-bottom: 8px;
        }

        .empty-state small {
            font-size: 13px;
        }

        /* 响应式 */
        @media (max-width: 1366px) {
            .sidebar {
                width: 240px;
            }
            .main-content {
                margin-left: 240px;
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 左侧导航栏 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>
                    个人工作台
                    <span class="version">v3.0</span>
                </h1>
            </div>
            
            <nav class="nav-menu">
                <div class="nav-item active" data-section="work">
                    <i data-feather="clipboard"></i>
                    <span>工作计划</span>
                    <span class="badge">3</span>
                </div>
                <div class="nav-item" data-section="fitness">
                    <i data-feather="activity"></i>
                    <span>减脂塑形</span>
                </div>
                <div class="nav-item" data-section="media">
                    <i data-feather="video"></i>
                    <span>自媒体运营</span>
                </div>
                <div class="nav-item" data-section="thought">
                    <i data-feather="edit-3"></i>
                    <span>今日感悟</span>
                </div>
                <div class="nav-item" data-section="pomodoro">
                    <i data-feather="clock"></i>
                    <span>番茄钟</span>
                </div>
                <div class="nav-item" data-section="stats">
                    <i data-feather="bar-chart-2"></i>
                    <span>数据统计</span>
                </div>
                <div class="nav-item" data-section="expression">
                    <i data-feather="book-open"></i>
                    <span>表达训练</span>
                </div>
            </nav>
            
            <div class="sidebar-footer">
                <button class="ai-trigger">
                    <i data-feather="cpu"></i>
                    <span>AI 助手</span>
                </button>
            </div>
        </aside>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 时间区域 -->
            <div class="time-header">
                <div class="time" id="currentTime">00:00:00</div>
                <div class="date" id="currentDate">加载中...</div>
            </div>

            <!-- 工作计划区 -->
            <section class="content-section active" id="work-section">
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">
                            <i data-feather="plus-circle"></i>
                            添加工作计划
                        </h2>
                    </div>
                    
                    <div class="input-group">
                        <label>任务标题</label>
                        <input type="text" id="taskTitle" placeholder="今天要完成什么？">
                    </div>
                    
                    <div class="input-group">
                        <label>详细描述</label>
                        <textarea id="taskDesc" placeholder="详细说明..."></textarea>
                    </div>
                    
                    <div class="input-group">
                        <label>优先级</label>
                        <select id="taskPriority">
                            <option value="high">高优先级</option>
                            <option value="medium" selected>中优先级</option>
                            <option value="low">低优先级</option>
                        </select>
                    </div>
                    
                    <button class="btn btn-primary" onclick="addTask()">
                        <i data-feather="plus"></i>
                        添加任务
                    </button>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">
                            <i data-feather="list"></i>
                            今日任务列表
                        </h2>
                    </div>
                    
                    <div id="taskList">
                        <!-- 示例任务 -->
                        <div class="task-item">
                            <div class="task-checkbox"></div>
                            <div class="task-content">
                                <div class="task-title">完成个人工作台 v3.0 设计稿</div>
                                <div class="task-meta">
                                    <span class="priority-badge priority-high">高优先级</span>
                                    <span>预计 2 小时</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="task-item">
                            <div class="task-checkbox"></div>
                            <div class="task-content">
                                <div class="task-title">学习 Todoist 设计语言</div>
                                <div class="task-meta">
                                    <span class="priority-badge priority-medium">中优先级</span>
                                    <span>预计 1 小时</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 其他区域占位 -->
            <section class="content-section" id="fitness-section">
                <div class="card">
                    <div class="empty-state">
                        <i data-feather="activity"></i>
                        <p>减脂塑形管理</p>
                        <small>功能开发中...</small>
                    </div>
                </div>
            </section>

            <section class="content-section" id="media-section">
                <div class="card">
                    <div class="empty-state">
                        <i data-feather="video"></i>
                        <p>自媒体运营</p>
                        <small>功能开发中...</small>
                    </div>
                </div>
            </section>

            <section class="content-section" id="thought-section">
                <div class="card">
                    <div class="empty-state">
                        <i data-feather="edit-3"></i>
                        <p>今日感悟与进步</p>
                        <small>功能开发中...</small>
                    </div>
                </div>
            </section>

            <section class="content-section" id="pomodoro-section">
                <div class="card">
                    <div class="empty-state">
                        <i data-feather="clock"></i>
                        <p>番茄钟计时器</p>
                        <small>功能开发中...</small>
                    </div>
                </div>
            </section>

            <section class="content-section" id="stats-section">
                <div class="card">
                    <div class="empty-state">
                        <i data-feather="bar-chart-2"></i>
                        <p>数据统计看板</p>
                        <small>功能开发中...</small>
                    </div>
                </div>
            </section>

            <section class="content-section" id="expression-section">
                <div class="card">
                    <div class="empty-state">
                        <i data-feather="book-open"></i>
                        <p>表达训练模块</p>
                        <small>功能开发中...</small>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // 初始化 Feather Icons
        feather.replace();

        // 时间更新
        function updateTime() {
            const now = new Date();
            const time = now.toLocaleTimeString('zh-CN', { hour12: false });
            const date = now.toLocaleDateString('zh-CN', { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric',
                weekday: 'long'
            });
            
            document.getElementById('currentTime').textContent = time;
            document.getElementById('currentDate').textContent = date;
        }
        
        updateTime();
        setInterval(updateTime, 1000);

        // 导航切换
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function() {
                // 移除所有 active
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
                
                // 添加当前 active
                this.classList.add('active');
                const section = this.getAttribute('data-section');
                document.getElementById(section + '-section').classList.add('active');
            });
        });

        // 添加任务功能
        function addTask() {
            const title = document.getElementById('taskTitle').value;
            const desc = document.getElementById('taskDesc').value;
            const priority = document.getElementById('taskPriority').value;
            
            if (!title) {
                alert('请输入任务标题');
                return;
            }
            
            const priorityMap = {
                'high': { class: 'priority-high', text: '高优先级' },
                'medium': { class: 'priority-medium', text: '中优先级' },
                'low': { class: 'priority-low', text: '低优先级' }
            };
            
            const taskHtml = `
                <div class="task-item">
                    <div class="task-checkbox"></div>
                    <div class="task-content">
                        <div class="task-title">${title}</div>
                        <div class="task-meta">
                            <span class="priority-badge ${priorityMap[priority].class}">${priorityMap[priority].text}</span>
                            ${desc ? '<span>' + desc.substring(0, 30) + '...</span>' : ''}
                        </div>
                    </div>
                </div>
            `;
            
            document.getElementById('taskList').insertAdjacentHTML('afterbegin', taskHtml);
            
            // 清空输入
            document.getElementById('taskTitle').value = '';
            document.getElementById('taskDesc').value = '';
            document.getElementById('taskPriority').value = 'medium';
            
            // 更新徽章数字
            const badge = document.querySelector('[data-section="work"] .badge');
            const count = document.querySelectorAll('#taskList .task-item').length;
            badge.textContent = count;
        }

        // 任务复选框交互
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('task-checkbox')) {
                e.target.classList.toggle('checked');
                e.target.parentElement.style.opacity = e.target.classList.contains('checked') ? '0.5' : '1';
            }
        });
    </script>
</body>
</html>
